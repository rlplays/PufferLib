[base]
package = ocean
policy_name = Policy
env_name = rlplays
rnn_name = Recurrent

[env]
num_envs = 4096
height = 1728
width = 3072
num_actions = 7
num_obs = 1020
headless = 1

[sweep.train.total_timesteps]
distribution = log_normal
min = 3e7
max = 2e8
scale = 0.5
mean = 1e8

[train]
total_timesteps = 100_000_000
gamma = 0.99
minibatch_size = 65536
learning_rate = 0.015
ent_coef = 0.02

