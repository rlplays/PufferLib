[base]
package = ocean
env_name = puffer_grid_interact
policy_name = Policy
rnn_name = Recurrent

[env]
num_envs = 1024
num_agents = 1
width = 1000
height = 1000
cell_size = 200
num_rewards = 1
fov = 7
cell_types = 5

[train]
total_timesteps = 1_000_000
gamma = 0.95
learning_rate = 0.05
minibatch_size = 65536
ent_coef = 0.02


[sweep.train.total_timesteps]
distribution = log_normal
min = 3e7
max = 2e8
mean = 1e8
scale = 0.5
