[base]
package = ocean
env_name = puffer_grid_interact
policy_name = Policy
rnn_name = Recurrent

[env]
num_envs = 1024
num_agents = 1
width = 2000
height = 2000
cell_size = 100
num_rewards = 10
fov = 9
cell_types = 4

[train]
total_timesteps = 500_000_000
gamma = 0.99
learning_rate = 0.015
minibatch_size = 65536
ent_coef = 0.02


[sweep.train.total_timesteps]
distribution = log_normal
min = 3e7
max = 2e8
mean = 1e8
scale = 0.5
