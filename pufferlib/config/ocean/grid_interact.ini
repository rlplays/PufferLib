[base]
package = ocean
env_name = puffer_grid_interact
policy_name = Policy
rnn_name = Recurrent

[env]
num_envs = 4096
num_agents = 1
width = 1000
height = 1000
cell_size = 100
num_rewards = 5
fov = 12
cell_types = 6

[train]
total_timesteps = 100_000_000
gamma = 0.99
learning_rate = 0.015
minibatch_size = 65536
ent_coef = 0.02


[sweep.train.total_timesteps]
distribution = log_normal
min = 3e7
max = 2e8
mean = 1e8
scale = 0.5
